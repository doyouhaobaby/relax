[package]
name = "relax-compiler"
version = "0.1.0"
edition = "2021"
description = "Relax: live compiler and runtime for a strict, safe Rust dialect"
license = "MIT OR Apache-2.0"
publish = false
# tests/ holds Relax compiler fixtures, including intentional compile-fail programs.
# The native library tests are in src/; fixtures run through the compiler test runners.
autotests = false

# files outside this crate its build reads (makepad-source-slice ships them in a slice or source archive)
[package.metadata.commercial]
include = ["../build_stamp.rs", "../self_stamp.rs", "std"]

# devhub runs these tests in the lane's tree, never a JIT overlay: the build script runs cargo
# metadata on this manifest, and an overlay's tree is one only the JIT process reads
[package.metadata.makepad]
test-tree = "its build script runs cargo metadata on the checkout"

[package.metadata.makepad.platform-gaps]
windows = { "lib" = "16 of 468 fail there: cache and check reuse (4); platform gaps (6): native binaries (3), a 32-bit lab, WSABUF, a directory read as a file; untriaged (6)" }

# a Windows box runs its unit tests after the landings that reach it (devhub's windows-tests
# bucket), all but those still red there, by their exact names, until the relaxwin lane lands
# their fixes: its Windows code (SEH, its memory, sockets, handles) is tested nowhere else
[package.metadata.makepad.windows-tests.lib]
why = "its Windows code: SEH, its memory, sockets and handles"
known = "the relaxwin lane"
skip = [
    "cache::data_tests::two_checkouts_share_only_the_code_of_their_sealed_crates",
    "check_reuse_tests::a_copy_in_another_worktree_reuses_its_verdicts_with_its_own_paths",
    "jit::trap_fill_tests::a_trap_filled_range_traps_at_any_offset_while_its_page_neighbour_runs_on",
]

[lib]
name = "relax_compiler"
path = "src/lib.rs"

[[test]]
name = "enum_tag16"
path = "tests/enum_tag16.rs"

[dependencies]
makepad-thread-local = { path = "../../thread_local", version = "1.0.0" }
makepad-cpu-budget = { workspace = true }
makepad-core-util = { path = "../../core_util", version = "0.1.0" }
# the git store's deflate/inflate (src/inflate), the manifests' TOML (src/toml) and the
# proc-macro token model (makepad's libs/relax/lex) need no registry dependencies.
relax-backend = { workspace = true }
relax-codegen = { workspace = true }
# the layers below the JIT, each its own crate so they compile in parallel/pipelined and are
# reused when only a layer above changes: relax-base <- relax-front <- relax-types <- relax-compiler
relax-types = { workspace = true }
relax-front = { workspace = true }
relax-session = { workspace = true }
# direct so the codegen identity (build.rs, src/codegen_id.rs) names their source stamps
relax-base = { workspace = true }
relax-lex = { workspace = true }
makepad-remote = { workspace = true }
makepad-strict-json = { workspace = true }
makepad-gpu-trace = { workspace = true }
makepad-prof-stream = { workspace = true }
# registry packages a program needs that are neither vendored nor in $CARGO_HOME (registry_net.rs)
relax-light-http = { workspace = true }
relax-native-macros = { workspace = true }
# the payload a panic of JIT code takes through rustc's frames, which their shims recognise
# (jit.rs native_raise, relax_api::caught)
relax-api = { workspace = true }

# inspect's stack capture on Windows (threads.rs, pe_unwind.rs): the generated Win32 bindings
[target.'cfg(windows)'.dependencies]
makepad-windows-sys = { path = "../../windows/sys", version = "0.1.0" }

[lints.rust]
# `cfg(relax)`: set when makepad run (Relax) compiles the crate
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(relax)"] }
